name: build-bags-manifest

# data/bags/*.json -> data/bags.json
# Yeni "Cantanizi siz doldurun" builder'i icin manifest uretici.
# Mevcut build-gift-bags-manifest.yml ESKI sistem icin korunuyor (events relation'i bagli).

on:
  push:
    branches: [main]
    paths:
      - 'data/bags/**'
      - 'scripts/build-bags-manifest.mjs'
      - '.github/workflows/build-bags-manifest.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: build-bags-manifest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build manifest
        run: node scripts/build-bags-manifest.mjs

      - name: Manifest değiştiyse PR aç ve otomatik birleştir
        # NOT: [skip ci] kullanma — Cloudflare Pages deploy'u atlar.
        # Doğrudan push yerine PR akışı: main-protection ruleset ile uyumlu.
        # Loop guard: on.push.paths filtresi data/bags.json içermiyor,
        # bu PR merge edildiğinde workflow yeniden tetiklenmez.
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "data/bags.json: çanta manifesti güncellendi"
          title: "data/bags.json: çanta manifesti güncellendi"
          body: "Otomatik manifest güncellemesi — `build-bags-manifest` workflow tarafından üretildi."
          branch: ci/update-bags-manifest
          base: main
          delete-branch: true
          add-paths: data/bags.json
          auto-merge: squash
