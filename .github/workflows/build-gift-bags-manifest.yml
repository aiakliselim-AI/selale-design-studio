name: build-gift-bags-manifest

on:
  push:
    branches: [main]
    paths:
      - 'gift-bags/**'
      - 'gift-bag-items/**'
      - 'scripts/build-gift-bags-manifest.mjs'
      - '.github/workflows/build-gift-bags-manifest.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: build-gift-bags-manifest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install js-yaml
        run: npm install --no-save --silent js-yaml@4

      - name: Build manifest
        run: node scripts/build-gift-bags-manifest.mjs

      - name: Manifest değiştiyse PR aç ve otomatik birleştir
        # NOT: [skip ci] kullanma — Cloudflare Pages deploy'u atlar.
        # Doğrudan push yerine PR akışı: main-protection ruleset ile uyumlu.
        # Loop guard: on.push.paths filtresi data/gift-bags*.json içermiyor,
        # bu PR merge edildiğinde workflow yeniden tetiklenmez.
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "data/gift-bags*.json: şeffaf çanta manifestleri güncellendi"
          title: "data/gift-bags*.json: şeffaf çanta manifestleri güncellendi"
          body: "Otomatik manifest güncellemesi — `build-gift-bags-manifest` workflow tarafından üretildi."
          branch: ci/update-gift-bags-manifest
          base: main
          delete-branch: true
          add-paths: |
            data/gift-bags.json
            data/gift-bag-items.json
          auto-merge: squash
