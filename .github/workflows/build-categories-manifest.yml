name: build-categories-manifest

on:
  push:
    branches: [main]
    paths:
      - 'categories/**'
      - 'scripts/build-categories-manifest.mjs'
      - '.github/workflows/build-categories-manifest.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: build-categories-manifest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install js-yaml
        run: npm install --no-save --silent js-yaml@4

      - name: Build manifest
        run: node scripts/build-categories-manifest.mjs

      - name: Manifest değiştiyse PR aç ve otomatik birleştir
        # NOT: [skip ci] kullanma — Cloudflare Pages deploy'u atlar.
        # Doğrudan push yerine PR akışı: main-protection ruleset ile uyumlu.
        # Loop guard: on.push.paths filtresi data/categories.json içermiyor,
        # bu PR merge edildiğinde workflow yeniden tetiklenmez.
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "data/categories.json: kategori manifesti güncellendi"
          title: "data/categories.json: kategori manifesti güncellendi"
          body: "Otomatik manifest güncellemesi — `build-categories-manifest` workflow tarafından üretildi."
          branch: ci/update-categories-manifest
          base: main
          delete-branch: true
          add-paths: data/categories.json
          auto-merge: squash
