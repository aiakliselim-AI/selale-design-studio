name: build-events-manifest

on:
  push:
    branches: [main]
    paths:
      - 'events/**'
      - 'scripts/build-events-manifest.mjs'
      - '.github/workflows/build-events-manifest.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-events-manifest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install js-yaml
        run: npm install --no-save --silent js-yaml@4

      - name: Build manifest
        run: node scripts/build-events-manifest.mjs

      - name: Commit manifest if changed
        # NOT: commit mesaji [skip ci] icermez — Cloudflare Pages [skip ci] gorunce
        # deploy'u atliyor, bu da data/events.json guncellemelerinin canli siteye
        # yansimamasina neden oluyordu. Workflow kendini sonsuz tetiklemiyor cunku
        # `on.push.paths` filtresi yalnizca events/**, scripts/** ve bu workflow
        # dosyasinda degisiklik olunca calisiyor; data/events.json bu listede yok.
        run: |
          if [ -n "$(git status --porcelain data/events.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/events.json
            git commit -m "data/events.json: özel gün konseptleri manifesti güncellendi"
            git push
          else
            echo "manifest is up to date"
          fi
